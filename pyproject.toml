[project]
name = "ai-governance-dashboard"
version = "1.0.0"
description = "Governance gateway and dashboard for enterprise LLM usage: tracing, cost, budgets, guardrails, tamper-evident audit"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
